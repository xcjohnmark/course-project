<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <meta name="description" content="We are working on something exciting. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      position: relative;
      padding: 24px;
    }

    /* Ambient background glows */
    .glow-1, .glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
    }

    .glow-1 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, #6366f1 0%, transparent 70%);
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 8s ease-in-out infinite alternate;
    }

    .glow-2 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #ec4899 0%, transparent 70%);
      bottom: 10%;
      right: 20%;
      animation: pulse 10s ease-in-out infinite alternate-reverse;
    }

    @keyframes pulse {
      0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.9); }
      100% { opacity: 0.55; transform: translate(-50%, -50%) scale(1.1); }
    }

    /* Container Card */
    .container {
      position: relative;
      z-index: 1;
      max-width: 620px;
      width: 100%;
      text-align: center;
      padding: 56px 40px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Status badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 10px #34d399;
      animation: blink 2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Heading */
    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Description */
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 460px;
      margin: 0 auto;
    }

    /* Footer */
    footer {
      margin-top: 36px;
      font-size: 0.85rem;
      color: #64748b;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 640px) {
      .container {
        padding: 40px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <main class="container">
    <div class="badge">
      <span class="status-dot"></span>
      In Development
    </div>
    <h1>Coming soon</h1>
    <p>We're building something great. Stay tuned for the launch!</p>
  </main>

  <footer>
    &copy; <span id="year"></span> All rights reserved.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
